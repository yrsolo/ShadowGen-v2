name: CI

on:
  push:
  pull_request:

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: python -m pytest
      - name: Run docs check
        shell: pwsh
        run: ./scripts/docs-check.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t shadowgen-api-ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t shadowgen-worker-ci .
